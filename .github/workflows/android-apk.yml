name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check Supabase secrets
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase secrets are missing. Add EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY in Settings > Secrets > Actions."
            exit 1
          fi
          echo "Supabase secrets present."

      - name: Verify API configuration
        run: node scripts/check-auth-env.cjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK
        timeout-minutes: 25
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: honarezendegi-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - run: cp android/app/build/outputs/apk/release/app-release.apk honarezendegi-android-1.0.3.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.3
          name: هنر زندگی نسخهٔ ۱.۰.۳ برای اندروید
          body: فایل نصب اندروید هنر زندگی نسخهٔ ۱.۰.۳.
          files: honarezendegi-android-1.0.3.apk
