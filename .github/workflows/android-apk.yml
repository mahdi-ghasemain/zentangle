name: Android APK (preview)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check Supabase secrets
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase secrets are missing. Add EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY in Settings > Secrets > Actions."
            exit 1
          fi
          echo "Supabase secrets present."

      - name: Verify API configuration
        run: node scripts/check-auth-env.cjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - run: npx expo prebuild --platform android --non-interactive --clean

      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zentangle-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk zentangle-preview.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: پیش‌نمایش اندروید
          body: فایل نصب پیش‌نمایش هنر زندگی (به‌روزرسانی خودکار با هر بیلد موفق)
          files: zentangle-preview.apk
